<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarasota County CAD Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg:      #07111e;
    --surface: #0c1a2a;
    --border:  #1a3550;
    --border2: #2a5070;
    --accent:  #00d4ff;
    --accent2: #00aadd;
    --red:     #ff3a3a;
    --red2:    #cc1010;
    --amber:   #ffbb00;
    --green:   #00ff88;
    --text:    #c8e0f4;
    --text2:   #e8f4ff;
    --muted:   #5a7a96;
    --dim:     #2a4a66;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,180,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,180,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none; z-index: 0;
  }

  body::after {
    content: '';
    pointer-events: none;
  }

  .vignette { display: none; }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(180deg, #0a1828 0%, #0c1e30 100%);
    border-bottom: 1px solid var(--border2);
    padding: 14px 20px;
    box-shadow: 0 2px 30px rgba(0,180,255,0.07);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  header::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--red), var(--accent), transparent);
    animation: topline 4s ease-in-out infinite;
  }

  @keyframes topline { 0%,100%{opacity:0.5} 50%{opacity:1} }

  .header-row1 { display: flex; align-items: center; gap: 10px; }

  .header-row2 {
    display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap;
    gap: 8px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .brand-shield {
    width: 48px; height: 48px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--red2), var(--red));
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    animation: shield-pulse 2.5s ease-in-out infinite;
  }

  @keyframes shield-pulse {
    0%,100% { box-shadow: 0 0 16px rgba(255,58,58,0.5), 0 0 40px rgba(255,58,58,0.2); }
    50%      { box-shadow: 0 0 24px rgba(255,58,58,0.8), 0 0 60px rgba(255,58,58,0.4); }
  }

  .brand-text {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 26px; letter-spacing: 5px; color: var(--text2);
    text-shadow: 0 0 20px rgba(0,212,255,0.3); white-space: nowrap;
    text-transform: uppercase;
  }

  .brand-sub {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 11px; letter-spacing: 3px; color: var(--muted);
    margin-top: 2px; white-space: nowrap; text-transform: uppercase;
  }

  .live-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,255,136,0.06); border: 1px solid rgba(0,255,136,0.3);
    padding: 6px 12px; font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; letter-spacing: 3px; color: var(--green);
    text-shadow: 0 0 8px var(--green); text-transform: uppercase;
  }

  .live-dot {
    width: 8px; height: 8px; background: var(--green); border-radius: 50%;
    box-shadow: 0 0 8px var(--green); animation: blink 0.8s step-end infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Feed health: live (default) / stale / offline */
  .live-pill.stale   { background: rgba(255,187,0,0.06); border-color: rgba(255,187,0,0.35); color: var(--amber); text-shadow: 0 0 8px var(--amber); }
  .live-pill.stale .live-dot   { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: none; }
  .live-pill.offline { background: rgba(255,58,58,0.06); border-color: rgba(255,58,58,0.35); color: var(--red); text-shadow: 0 0 8px var(--red); }
  .live-pill.offline .live-dot { background: var(--red); box-shadow: 0 0 8px var(--red); }

  #data-age {
    font-family: 'Inter', sans-serif; font-weight: 300; font-size: 11px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase; white-space: nowrap;
  }
  #data-age.stale   { color: var(--amber); }
  #data-age.offline { color: var(--red); }

  .sound-btn {
    background: rgba(0,180,255,0.05); border: 1px solid var(--border2);
    color: var(--muted); font-size: 16px; padding: 6px 10px; cursor: pointer;
    transition: all 0.2s; line-height: 1;
  }
  .sound-btn[aria-pressed="true"] { color: var(--green); border-color: rgba(0,255,136,0.4); }

  #clock {
    font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 600;
    color: var(--accent); letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(0,212,255,0.6);
  }

  .refresh-btn {
    background: rgba(0,180,255,0.05); border: 1px solid var(--border2);
    color: var(--muted); font-family: 'Share Tech Mono', monospace;
    font-size: 20px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; line-height: 1;
  }
  .refresh-btn:hover, .refresh-btn:active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(0,212,255,0.2); }
  .refresh-btn.spinning { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== STATS ===== */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--surface); border-bottom: 1px solid var(--border2);
    position: relative; z-index: 1;
  }

  .stat { padding: 16px 8px; text-align: center; border-right: 1px solid var(--border); }
  .stat:last-child { border-right: none; }

  .stat-num {
    font-family: 'Rajdhani', sans-serif; font-size: 48px; font-weight: 700;
    line-height: 1; color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.5); transition: all 0.4s;
  }
  .stat-num.red   { color: var(--red);   text-shadow: 0 0 20px rgba(255,58,58,0.6); }
  .stat-num.amber { color: var(--amber); text-shadow: 0 0 20px rgba(255,187,0,0.5); }
  .stat-num.green { color: var(--green); text-shadow: 0 0 20px rgba(0,255,136,0.5); }

  .stat-label {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; letter-spacing: 4px; color: var(--muted);
    margin-top: 4px; text-transform: uppercase;
  }

  /* ===== AGENCY FILTER ROW ===== */
  .agency-bar {
    display: flex; background: rgba(8,18,32,0.9); border-bottom: 1px solid var(--border2);
    overflow-x: auto; scrollbar-width: none; position: relative; z-index: 1;
    padding: 0 2px;
  }
  .agency-bar::-webkit-scrollbar { display: none; }

  .agency-btn {
    flex-shrink: 0; padding: 10px 16px;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }

  .agency-btn.active {
    color: var(--accent); border-bottom-color: var(--accent);
    background: rgba(0,212,255,0.06);
    text-shadow: 0 0 8px rgba(0,212,255,0.4);
  }

  .agency-btn.npfd.active  { color: #ff6060; border-bottom-color: #ff6060; background: rgba(255,60,60,0.05); }
  .agency-btn.scfd.active  { color: var(--accent); border-bottom-color: var(--accent); }
  .agency-btn.vfd.active   { color: #60c0ff; border-bottom-color: #60c0ff; background: rgba(96,192,255,0.05); }
  .agency-btn.efd.active   { color: var(--amber); border-bottom-color: var(--amber); background: rgba(255,187,0,0.05); }
  .agency-btn.nvfd.active  { color: #80ff80; border-bottom-color: #80ff80; background: rgba(128,255,128,0.05); }
  .agency-btn.other.active { color: #c080ff; border-bottom-color: #c080ff; background: rgba(192,128,255,0.05); }
  .agency-btn.fhp.active   { color: #ffd24a; border-bottom-color: #ffd24a; background: rgba(255,210,74,0.05); }

  /* ===== MAP ===== */
  .map-section { border-bottom: 1px solid var(--border2); position: relative; z-index: 1; }

  .map-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: rgba(0,10,20,0.9); border-bottom: 1px solid var(--border);
  }

  .map-title {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; letter-spacing: 4px; color: var(--accent2); text-transform: uppercase;
  }

  .map-legend { display: flex; gap: 16px; align-items: center; }

  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #map { height: 320px; width: 100%; background: #020810; z-index: 1; }

  .leaflet-tile-pane { filter: brightness(0.7) saturate(0.5) hue-rotate(190deg); }
  .leaflet-control-zoom { border: 1px solid var(--border2) !important; border-radius: 0 !important; }
  .leaflet-control-zoom a { background: #0a1828 !important; color: var(--accent) !important; border-color: var(--border2) !important; border-radius: 0 !important; }
  .leaflet-popup-content-wrapper { background: rgba(10,25,45,0.98) !important; border: 1px solid var(--border2) !important; border-radius: 0 !important; color: var(--text) !important; box-shadow: 0 4px 30px rgba(0,0,0,0.6) !important; }
  .leaflet-popup-tip { background: #0a1828 !important; }
  .leaflet-popup-content { font-family: 'Barlow Condensed', sans-serif !important; font-size: 15px !important; margin: 12px 16px !important; line-height: 1.5 !important; }
  .popup-type { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; color:var(--text2); margin-bottom:5px; letter-spacing:2px; text-transform:uppercase; }
  .popup-addr { color:var(--muted); font-size:13px; font-family:'Share Tech Mono',monospace; }
  .popup-time { color:var(--accent); font-size:11px; font-family:'Share Tech Mono',monospace; margin-top:6px; letter-spacing:1px; }

  /* ===== TYPE FILTER TABS ===== */
  .filter-bar {
    display: flex; background: var(--surface); border-bottom: 1px solid var(--border2);
    overflow-x: auto; scrollbar-width: none; position: relative; z-index: 1;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .tab {
    flex: 1; min-width: 70px; padding: 12px 4px;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }

  .tab.active {
    color: var(--accent); border-bottom-color: var(--accent);
    background: rgba(0,212,255,0.04);
    text-shadow: 0 0 8px rgba(0,212,255,0.4);
  }

  /* ===== SIDE BY SIDE LAYOUT ===== */
  /* Body is a vertical flex container so top bars take natural height
     and main-layout gets all remaining space */
  body {
    display: flex;
    flex-direction: column;
  }

  .main-layout {
    display: flex;
    flex-direction: row;
    flex: 1;
    min-height: 0;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  /* Left: map column */
  .map-col {
    width: 42%;
    flex-shrink: 0;
    border-right: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .map-col .map-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-bottom: none;
    overflow: hidden;
  }

  .map-col #map {
    flex: 1;
    height: auto !important;
    min-height: 0;
  }

  /* Right: incident list column */
  .list-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .filter-bar { flex-shrink: 0; }
  #status-bar { flex-shrink: 0; }
  .list-footer { flex-shrink: 0; }

  #incident-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
  }

  /* Mobile */
  @media (max-width: 768px) {
    html, body { overflow: auto; }

    body { display: block; }

    .main-layout {
      flex-direction: column;
      height: auto;
      overflow: visible;
    }

    .map-col {
      width: 100%;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border2);
      overflow: visible;
    }

    .map-col #map { height: 260px !important; }

    .list-col { overflow: visible; height: auto; }

    #incident-list { overflow: visible; flex: none; }

  }

  /* ===== MAP VIEW TOGGLE / PULSEPOINT EMBED ===== */
  .map-tabs { display: flex; gap: 4px; }
  .map-tab {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 10px; letter-spacing: 2px; padding: 4px 10px;
    text-transform: uppercase; cursor: pointer; transition: all 0.2s;
  }
  .map-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.06); }
  .map-tab.pp.active { color: #ff6b6b; border-color: #ff6b6b; background: rgba(255,58,58,0.07); }
  .map-tab:focus-visible, .agency-btn:focus-visible, .tab:focus-visible, .refresh-btn:focus-visible,
  .sound-btn:focus-visible, .pp-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  /* Map body holds the Leaflet map and/or the PulsePoint panel */
  .map-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .pp-panel {
    display: none; flex: 1; flex-direction: column; min-height: 0;
    padding: 10px; gap: 8px;
    background:
      radial-gradient(ellipse at top left, rgba(255,58,58,0.07), transparent 60%),
      linear-gradient(180deg, #0a1626 0%, #07111e 100%);
  }
  .map-section.view-pp  #map { display: none; }
  .map-section.view-pp  .pp-panel { display: flex; }
  .map-section.view-pp  .map-legend { display: none; }
  .map-section.view-split .pp-panel { display: flex; border-top: 1px solid var(--border2); }

  .pp-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .pp-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pp-pulse {
    width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(255,58,58,0.6); animation: pp-pulse 1.6s ease-out infinite;
  }
  @keyframes pp-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,58,58,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(255,58,58,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,58,58,0); }
  }
  .pp-name {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 16px;
    letter-spacing: 3px; color: var(--text2); text-transform: uppercase; white-space: nowrap;
  }
  .pp-sub {
    font-family: 'Inter', sans-serif; font-weight: 300; font-size: 10px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pp-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .pp-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 28px; padding: 0 8px;
    background: rgba(0,180,255,0.04); border: 1px solid var(--border);
    color: var(--muted); font-family: 'Inter', sans-serif; font-size: 13px;
    cursor: pointer; text-decoration: none; transition: all 0.2s;
  }
  .pp-btn:hover { color: var(--accent); border-color: var(--accent); }
  .pp-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--border2); }

  .pp-frame-wrap {
    position: relative; flex: 1; min-height: 0;
    border: 1px solid var(--border2); border-radius: 6px; overflow: hidden;
    background: var(--surface);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 8px 30px rgba(0,0,0,0.45), 0 0 24px rgba(255,58,58,0.06);
  }
  #pp-frame { display: block; width: 100%; height: 100%; border: 0; background: var(--surface); }
  /* Dark rendering: invert PulsePoint's light UI, then rotate hues back so reds stay red */
  .pp-dark #pp-frame { filter: invert(0.9) hue-rotate(180deg) saturate(1.1) contrast(0.95); }

  .pp-loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--surface); color: var(--muted);
    font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 3px;
    transition: opacity 0.4s; z-index: 2; text-align: center; padding: 0 20px;
  }
  .pp-loading.hidden { opacity: 0; pointer-events: none; }
  .pp-loading a { color: var(--accent2); }

  .map-header { flex-wrap: wrap; gap: 8px; }
  .map-tab { white-space: nowrap; }
  .pp-title > div { min-width: 0; overflow: hidden; }

  /* Mobile: the page scrolls, so map and PulsePoint get fixed heights instead of sharing the column */
  @media (max-width: 768px) {
    .map-col #map { flex: none; }
    .pp-panel { flex: none; height: 640px; }
    .map-section.view-split .pp-panel { height: 560px; }
    .map-header { padding: 8px 12px; }
  }
  @media (max-width: 480px) {
    .map-legend { display: none; }
  }

  #status-bar {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 2px; padding: 7px 18px; text-align: center;
    display: none; position: relative; z-index: 1;
  }
  #status-bar.warn  { display:block; background:rgba(255,170,0,0.06); border-bottom:1px solid rgba(255,170,0,0.2); color:var(--amber); }
  #status-bar.error { display:block; background:rgba(255,58,58,0.06); border-bottom:1px solid rgba(255,58,58,0.2); color:var(--red); }
  #status-bar.good  { display:block; background:rgba(0,255,136,0.04); border-bottom:1px solid rgba(0,255,136,0.15); color:var(--green); }

  /* ===== INCIDENT LIST ===== */
  #incident-list { padding-bottom: 40px; position: relative; z-index: 1; }

  .state-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 200px; gap: 14px;
    color: var(--muted); font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px;
  }

  .spinner {
    width: 28px; height: 28px; border: 1px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
    box-shadow: 0 0 12px rgba(0,212,255,0.2);
  }

  .inc-card {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 16px 20px; border-bottom: 1px solid rgba(26,53,80,0.6);
    border-left: 3px solid transparent; transition: all 0.15s;
    animation: fadein 0.3s ease; cursor: pointer; position: relative;
  }

  @keyframes fadein { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }

  .inc-card:active { background: rgba(0,212,255,0.03); }
  .inc-card.is-today { border-left-color: var(--red); background: rgba(255,58,58,0.04); }
  .inc-card.is-older { opacity: 0.7; }
  .inc-card.highlighted { background: rgba(0,212,255,0.05) !important; border-left-color: var(--accent) !important; opacity: 1 !important; }
  .inc-card:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }

  /* Incidents that arrived since the dashboard was opened */
  .inc-card.is-new { animation: fadein 0.3s ease, new-glow 2s ease-in-out 3; }
  @keyframes new-glow {
    0%,100% { box-shadow: inset 0 0 0 0 rgba(0,255,136,0); }
    50%     { box-shadow: inset 0 0 0 1px rgba(0,255,136,0.5), inset 0 0 24px rgba(0,255,136,0.08); }
  }
  .badge-new { background:rgba(0,255,136,0.1); color:var(--green); border:1px solid rgba(0,255,136,0.35); text-shadow:0 0 6px rgba(0,255,136,0.5); margin-right: 4px; }

  /* "Not mapped" indicator on cards */
  .map-flag {
    display: inline-block; font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 9px; letter-spacing: 1.5px; padding: 2px 6px; margin-left: 2px;
    border: 1px dashed var(--dim); color: var(--muted); text-transform: uppercase;
    vertical-align: middle; cursor: help;
  }
  .map-flag[data-state="ok"] { display: none; }
  .map-flag[data-state="pending"] { border-style: dotted; opacity: 0.7; }

  /* Cards already on screen before a refresh don't replay their entrance animation */

  .inc-icon {
    width: 52px; height: 52px;

  .inc-icon::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
  .inc-icon::after  { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }

  .icon-fire    { background:rgba(255,100,0,0.08);  border-color:rgba(255,100,0,0.4); }
  .icon-marine  { background:rgba(0,160,255,0.1);  border-color:rgba(0,160,255,0.35); }

  .icon-alarm   { background:rgba(255,187,0,0.06);  border-color:rgba(255,187,0,0.3); }
  .icon-other   { background:rgba(60,100,140,0.06); border-color:rgba(60,100,140,0.3); }

  .inc-body { flex: 1; min-width: 0; }

  .inc-type {
    font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 600;
    color: var(--text2); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; letter-spacing: 1px;

  .inc-addr {
    font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 14px; color: var(--text); margin-top: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

  .inc-addr.no-addr { color: var(--muted); font-style: italic; font-size: 13px; }

  .inc-case {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: 0.5px;
  }

  /* Agency tag */
  .agency-tag {
    display: inline-block; font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: 10px; letter-spacing: 1.5px; padding: 2px 7px;
    border: 1px solid var(--border); color: var(--muted);
    margin-right: 6px; vertical-align: middle; text-transform: uppercase;
  }
  .agency-tag.npfd { border-color:rgba(255,96,96,0.4); color:#ff6060; }
  .agency-tag.scfd { border-color:rgba(0,212,255,0.3); color:var(--accent2); }
  .agency-tag.vfd  { border-color:rgba(96,192,255,0.3); color:#60c0ff; }
  .agency-tag.efd  { border-color:rgba(255,187,0,0.3); color:var(--amber); }
  .agency-tag.nvfd { border-color:rgba(128,255,128,0.3); color:#80ff80; }
  .agency-tag.other { border-color:rgba(192,128,255,0.3); color:#c080ff; }
  .agency-tag.fhp  { border-color:rgba(255,210,74,0.4); color:#ffd24a; }

  .inc-notes {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; color: var(--muted); margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .inc-meta { text-align: right; flex-shrink: 0; }

  .inc-time {
    font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600;
    color: var(--accent); letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(0,212,255,0.4);
  }

  .inc-date {
    font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: 1px;
  }

  .status-badge {
    display: inline-block; font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: 9px; letter-spacing: 2px; padding: 3px 7px;
    margin-top: 5px; text-transform: uppercase;
  }
  .badge-today { background:rgba(255,58,58,0.12); color:var(--red); border:1px solid rgba(255,58,58,0.3); text-shadow:0 0 6px rgba(255,58,58,0.5); }
  .badge-older { background:rgba(30,50,80,0.3); color:var(--muted); border:1px solid var(--border); }

  #last-updated {
    text-align: center; font-family: 'Inter', sans-serif; font-weight: 300;
    font-size: 12px; color: var(--muted); letter-spacing: 2px; padding: 16px;

    padding: 0 14px 24px; position: relative; z-index: 1;
  }
  .source-note a { color: var(--accent2); text-decoration: none; }
</style>

<script>
  var WORKER_URL = "https://sarasota-cad-proxy.yanks126.workers.dev";

  // PulsePoint agency 16072 = Sarasota County [FL] (covers SCFD, North Port, Venice, Englewood, Nokomis, etc.)
  var PULSEPOINT_URL = "https://web.pulsepoint.org/?agencies=16072";

  // FHP statewide feed is filtered down to these counties (uppercase, as FHP spells them)
  var FHP_COUNTIES = ["SARASOTA"];

  var REFRESH_MS    = 60000;        // feed poll interval
  var STALE_MS      = 3 * 60000;    // no successful sync for this long -> STALE
  var OFFLINE_MS    = 10 * 60000;   // ...or this long -> OFFLINE
  var NEW_WINDOW_MS = 5 * 60000;    // how long an incident is flagged NEW after it first appears

  // Per-viewer preferences (view mode, sound, PulsePoint theme). Storage can be unavailable; never rely on it.
  function prefGet(k, d) { try { var v = localStorage.getItem("sccad_" + k); return v === null ? d : v; } catch(e) { return d; } }
  function prefSet(k, v) { try { localStorage.setItem("sccad_" + k, v); } catch(e) {} }

  // ===== Clock + feed health =====
  var lastSuccess = 0;     // epoch ms of last successful sync
  var lastAttemptFailed = false;

  function fmtAge(ms) {
    var s = Math.floor(ms / 1000);
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    return Math.floor(m / 60) + "h " + (m % 60) + "m ago";
  }

  function tick() {
    document.getElementById("clock").textContent =
      new Date().toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false});

    var pill = document.getElementById("live-pill");
    var text = document.getElementById("live-text");
    var age  = document.getElementById("data-age");
    if (!lastSuccess) {
      var failed = lastAttemptFailed;
      pill.className = "live-pill" + (failed ? " offline" : "");
      text.textContent = failed ? "OFFLINE" : "CONNECTING";
      age.className = failed ? "offline" : "";
      age.textContent = failed ? "NO DATA" : "SYNCING";
      return;
    }
    var ms = Date.now() - lastSuccess;
    var state = ms >= OFFLINE_MS ? "offline" : (ms >= STALE_MS ? "stale" : "");
    pill.className = "live-pill" + (state ? " " + state : "");
    text.textContent = state === "offline" ? "OFFLINE" : (state === "stale" ? "STALE" : "LIVE");
    age.className = state;
    age.textContent = "Updated " + fmtAge(ms);
  }
  setInterval(tick, 1000); tick();

  // ===== Map =====
  var SC_LAT = 27.10, SC_LNG = -82.25;
  var map = L.map("map", {center:[SC_LAT, SC_LNG], zoom:10, zoomControl:true, attributionControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:18}).addTo(map);

  function makeIcon(bg, glow, emoji) {
    var html = [
      '<div style="',
        'width:34px;height:34px;',
        'background:', bg, ';',
        'border:2px solid ', glow, ';',
        'border-radius:50%;',
        'display:flex;align-items:center;justify-content:center;',
        'box-shadow:0 0 10px ', glow, ';',
        'font-size:16px;line-height:1;',
      '">',
      emoji,
      '</div>'
    ].join('');
    return L.divIcon({
      className: "",
      html: html,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      popupAnchor: [0, -20]
    });
  }

  var ICONS = {
    fire_today:    makeIcon("rgba(255,80,0,0.9)",   "rgba(255,100,0,0.8)",  "🔥"),
    traffic_today: makeIcon("rgba(0,160,255,0.9)",  "rgba(0,200,255,0.8)",  "🚗"),
    alarm_today:   makeIcon("rgba(255,180,0,0.9)",  "rgba(255,200,0,0.8)",  "⚠"),
    marine_today:  makeIcon("rgba(0,140,220,0.9)",  "rgba(0,180,255,0.8)",  "⛵"),
    other_today:   makeIcon("rgba(60,120,180,0.9)", "rgba(80,150,220,0.8)", "⚡"),
    fire_older:    makeIcon("rgba(80,40,0,0.6)",    "rgba(120,60,0,0.4)",   "🔥"),
    traffic_older: makeIcon("rgba(0,60,100,0.6)",   "rgba(0,100,150,0.4)",  "🚗"),
    alarm_older:   makeIcon("rgba(80,60,0,0.6)",    "rgba(120,100,0,0.4)",  "⚠"),
    marine_older:  makeIcon("rgba(0,50,90,0.6)",    "rgba(0,80,140,0.4)",   "⛵"),
    other_older:   makeIcon("rgba(20,40,60,0.6)",   "rgba(40,70,100,0.4)",  "⚡"),
    fhp_today:     makeIcon("rgba(40,30,0,0.9)",    "rgba(255,210,74,0.9)", "🚓"),
    fhp_older:     makeIcon("rgba(40,30,0,0.6)",    "rgba(160,130,40,0.5)", "🚓"),
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
      return {"&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"}[c];
    });
  }

  var markersById = {};    // incident _id -> Leaflet marker (kept across refreshes so open popups survive)
  var allIncidents = [];
  var currentFilter = "all";
  var currentAgency = "all";
  var selectedId = null;   // highlighted card, survives refreshes
  var fitPending = true;   // re-fit the map on first load and on filter changes, not on background refreshes
  var renderSeq = 0;       // guards against overlapping async map renders
  var firstSeen = {};      // _id -> epoch ms first seen (0 = present on initial load)
  var initialLoadDone = false;

  // Stable, DOM-safe incident id from its source + case number, so it survives refreshes
  function makeId(prefix, s) {
    return prefix + "-" + String(s || "").replace(/[^A-Za-z0-9_-]/g, "");
  }

  // Determine agency from case number prefix
  function getAgency(caseNum) {
    if (!caseNum) return "other";
    var c = caseNum.toUpperCase();
    if (c.indexOf("NPFD") === 0) return "npfd";
    if (c.indexOf("SCFD") === 0) return "scfd";
    if (c.indexOf("VFD")  === 0) return "vfd";
    if (c.indexOf("EFD")  === 0) return "efd";
    if (c.indexOf("NVFD") === 0) return "nvfd";
    if (c.indexOf("LBFD") === 0) return "lbfd";
    return "other";
  }

  function getAgencyLabel(agency) {
    var labels = {npfd:"N.PORT", scfd:"SCFD", vfd:"VENICE", efd:"ENGLEWOOD", nvfd:"NOKOMIS", lbfd:"LBKEY", fhp:"FHP", other:"OTHER"};
    return labels[agency] || "OTHER";
  }

  function category(t) {
    if (!t) return "other";
    t = t.toUpperCase();
    // Traffic must be checked FIRST so crash/collision incidents are not caught by injury patterns
    if (/TRAFFIC|CRASH|COLLISION|ACCIDENT|MVC/.test(t)) return "traffic";
    if (/ALARM|CARBON|MONOXIDE/.test(t)) return "alarm";
    if (/FIRE|BRUSH|EXPLOSION|STRUCTURE|SMOKE|HAZMAT|BURNING|OUTSIDE FIRE|ELECTRICAL/.test(t)) return "fire";
    if (/MARINE|WATER|BOAT|DROWNING|FLOOD|SWIFT WATER|SURF|DIVE|VESSEL/.test(t)) return "marine";
    return "other";
  }

  function hasAddress(location) {
    if (!location || location.trim().length < 4) return false;
    var l = location.trim().toUpperCase();
    if (/^(GRID|REDACTED|UNKNOWN|N\/A|NONE)$/.test(l)) return false;
    // Exact street number at start (e.g. 9450 PIPER RD)
    if (/^\d+\s+\w/.test(l)) return true;
    // Intersection (contains /)
    if (l.indexOf("/") !== -1) return true;
    return false;
  }

  var CAT_EMOJI = {fire:"🔥", marine:"⛵", traffic:"🚗", alarm:"⚠", other:"⚡"};
  var CAT_CLS   = {fire:"icon-fire", marine:"icon-marine", traffic:"icon-traffic", alarm:"icon-alarm", other:"icon-other"};

  function getTodayStr() {
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    var yy = String(d.getFullYear()).slice(-2);
    return mm + "/" + dd + "/" + yy;
  }

  var statusTimer = null;
  function setStatus(msg, cls, clearAfterMs) {
    var el = document.getElementById("status-bar");
    el.className = cls || "";
    el.textContent = msg;
    clearTimeout(statusTimer);
    if (clearAfterMs) statusTimer = setTimeout(function() { setStatus("", ""); }, clearAfterMs);
  }

  function parseDispatchHTML(html) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, "text/html");
    var rows = doc.querySelectorAll("tr");
    var raw = [];
    var currentDate = "";
    var todayStr = getTodayStr();

    rows.forEach(function(row) {
      var fullText = row.textContent.trim();
      if (fullText.indexOf("Event Date:") !== -1) {
        var match = fullText.match(/(\d{2}\/\d{2}\/\d{2})/);
        if (match) currentDate = match[1];
        return;
      }

      var cells = row.querySelectorAll("td");
      if (cells.length < 7) return;

      var time    = cells[0].textContent.trim() || cells[1].textContent.trim();
      var event   = cells[2].textContent.trim();
      var location= cells[3].textContent.trim();
      var grid    = cells[4].textContent.trim();
      var zone    = cells[5].textContent.trim();
      var caseNum = cells[6].textContent.trim();

      if (!event || !caseNum) return;

      raw.push({
        date: currentDate, time: time, eventType: event,
        location: location, grid: grid, zone: zone,
        caseNum: caseNum, agency: getAgency(caseNum),
        isToday: currentDate === todayStr,
        mappable: hasAddress(location),
        _ts: cadTimestamp(currentDate, time)
      });
    });

    // Deduplicate: same eventType + location + time + date = one incident
    // Collect all agencies into an array on the first match
    var merged = [];
    var seen = {};

    raw.forEach(function(row) {
      var key = row.date + "|" + row.time + "|" + row.eventType.toUpperCase() + "|" + row.location.toUpperCase();
      if (seen[key] !== undefined) {
        // Add agency to existing incident if not already present
        var existing = merged[seen[key]];
        if (existing.agencies.indexOf(row.agency) === -1) {
          existing.agencies.push(row.agency);
          existing.caseNums.push(row.caseNum);
        }
      } else {
        seen[key] = merged.length;
        merged.push({
          date:      row.date,
          time:      row.time,
          eventType: row.eventType,
          location:  row.location,
          grid:      row.grid,
          zone:      row.zone,
          caseNum:   row.caseNum,
          caseNums:  [row.caseNum],
          agency:    row.agency,
          agencies:  [row.agency],
          isToday:   row.isToday,
          mappable:  row.mappable,
          source:    "cad",
          cat:       category(row.eventType),
          _ts:       row._ts,
          _id:       makeId("cad", row.caseNum)
        });
      }
    });

    return merged;
  }

  // "09/30/26" + "10:14" -> epoch ms (0 if unparseable, which sorts to the bottom)
  function cadTimestamp(date, time) {
    var d = (date || "").match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
    var t = (time || "").match(/^(\d{1,2}):(\d{2})/);
    if (!d || !t) return 0;
    return new Date(2000 + (+d[3]), +d[1] - 1, +d[2], +t[1], +t[2]).getTime();
  }

  // FHP incident type codes seen on trafficincidents.flhsmv.gov; unknown codes display as-is
  var FHP_TYPES = {
    S3: "HIT AND RUN CRASH", S4: "VEHICLE CRASH", S4I: "VEHICLE CRASH W/INJURIES",
    S4R: "VEHICLE CRASH W/ROADBLOCK", S4IR: "VEHICLE CRASH W/INJURIES AND ROADBLOCK",
    S7: "FATALITY", S14A: "TRAVEL ADVISORY", S16C: "CONSTRUCTION",
    S16D: "ROADWAY DEBRIS/OBJECT", S25P: "FIRE - PRESCRIBED BURN", S25S: "FIRE - STRUCTURE",
    S76R: "DISABLED VEHICLE IN ROADWAY"
  };

  // Parse the FHP CAD RSS feed. Each <description> is "Key: value<BR>Key: value..."
  function parseFhpRss(xml) {
    var doc = new DOMParser().parseFromString(xml, "text/xml");
    var todayStr = getTodayStr();
    var out = [];

    doc.querySelectorAll("item").forEach(function(item) {
      var titleEl = item.querySelector("title");
      var descEl = item.querySelector("description");
      if (!descEl) return;

      var f = {};
      descEl.textContent.split(/<br\s*\/?>/i).forEach(function(part) {
        var i = part.indexOf(":");
        if (i > 0) f[part.slice(0, i).trim()] = part.slice(i + 1).trim();
      });

      var county = (f["County"] || "").toUpperCase();
      if (FHP_COUNTIES.indexOf(county) === -1) return;

      var lat = parseFloat(f["Latitude"]), lng = parseFloat(f["Longitude"]);
      var hasCoords = !isNaN(lat) && !isNaN(lng) && inRegion(lat, lng);

      // "9/30/2026 10:52:09 AM"
      var when = new Date(f["CAD Date"] || "");
      var ok = !isNaN(when.getTime());
      var date = ok ? String(when.getMonth()+1).padStart(2,"0") + "/" + String(when.getDate()).padStart(2,"0") + "/" + String(when.getFullYear()).slice(-2) : "";
      var time = ok ? String(when.getHours()).padStart(2,"0") + ":" + String(when.getMinutes()).padStart(2,"0") : "";

      var code = (f["Incident Type"] || "").toUpperCase();
      var type = FHP_TYPES[code] || code || "TRAFFIC INCIDENT";
      // "I-75 SB x[MM205]" -> "I-75 SB / MM205"
      var loc = (f["Location"] || "").replace(/\s*x\[([^\]]*)\]/, " / $1").replace(/\s+/g, " ").trim();
      var city = (f["City"] || "").trim();
      var id = titleEl ? titleEl.textContent.replace(/^.*:\s*/, "").trim() : "";

      out.push({
        date: date, time: time, eventType: type,
        location: loc + (city ? ", " + city : ""),
        notes: (f["Remarks"] || "").trim(),
        zone: city, grid: "",
        caseNum: id, caseNums: [id],
        agency: "fhp", agencies: ["fhp"],
        isToday: date === todayStr,
        mappable: hasCoords,
        _lat: hasCoords ? lat : undefined,
        _lng: hasCoords ? lng : undefined,
        _geo: hasCoords ? "ok" : "none",
        source: "fhp",
        cat: /FIRE/.test(type) ? "fire" : "traffic",
        _ts: ok ? when.getTime() : 0,
        _id: makeId("fhp", id)
      });
    });

    return out;
  }

  // ===== Geocoding (via the worker, which holds the Google key and caches results) =====
  var SC_BOUNDS = {
    minLat: 26.50, maxLat: 27.90,
    minLng: -82.90, maxLng: -81.60
  };

  function inRegion(lat, lng) {
    return lat >= SC_BOUNDS.minLat && lat <= SC_BOUNDS.maxLat &&
           lng >= SC_BOUNDS.minLng && lng <= SC_BOUNDS.maxLng;
  }

  function cityFromZone(zone, agencies) {
    // Build a combined string from zone and all agency names to search
    var combined = (zone || "") + " " + (agencies ? agencies.join(" ") : "");
    var z = combined.toUpperCase();
    if (z.indexOf("NORTH PORT") !== -1 || z.indexOf("NPFD") !== -1) return "North Port";
    if (z.indexOf("VENICE") !== -1 || z.indexOf("VFD") !== -1)      return "Venice";
    if (z.indexOf("ENGLEWOOD") !== -1 || z.indexOf("EFD") !== -1)   return "Englewood";
    if (z.indexOf("NOKOMIS") !== -1 || z.indexOf("NVFD") !== -1)    return "Nokomis";
    if (z.indexOf("LONGBOAT") !== -1 || z.indexOf("LBFD") !== -1)   return "Longboat Key";
    if (z.indexOf("OSPREY") !== -1)                                  return "Osprey";
    return "Sarasota";
  }

  // I-75 mile marker coordinates — Charlotte, Sarasota, Manatee counties
  var I75_MM = {
    // Charlotte County (south end)
    170:{lat:26.8890,lng:-82.0460}, 171:{lat:26.8990,lng:-82.0520},
    172:{lat:26.9090,lng:-82.0580}, 173:{lat:26.9190,lng:-82.0640},
    174:{lat:26.9290,lng:-82.0700}, 175:{lat:26.9380,lng:-82.0760},
    176:{lat:26.9470,lng:-82.0820}, 177:{lat:26.9560,lng:-82.0870},
    178:{lat:26.9650,lng:-82.0910},
    // MM 179 = Exit 179 Toledo Blade Blvd (North Port, Sarasota County)
    179:{lat:26.9740,lng:-82.0950},
    180:{lat:26.9830,lng:-82.0980}, 181:{lat:26.9920,lng:-82.1000},
    182:{lat:27.0010,lng:-82.1020}, 183:{lat:27.0100,lng:-82.1040},
    184:{lat:27.0190,lng:-82.1055}, 185:{lat:27.0280,lng:-82.1065},
    186:{lat:27.0370,lng:-82.1070}, 187:{lat:27.0460,lng:-82.1070},
    188:{lat:27.0550,lng:-82.1068}, 189:{lat:27.0640,lng:-82.1065},
    190:{lat:27.0730,lng:-82.1060},
    // MM 191 = Exit 191 River Road
    191:{lat:27.0820,lng:-82.1055},
    192:{lat:27.0910,lng:-82.1048}, 193:{lat:27.1000,lng:-82.1040},
    194:{lat:27.1090,lng:-82.1030}, 195:{lat:27.1180,lng:-82.1018},
    196:{lat:27.1270,lng:-82.1005}, 197:{lat:27.1360,lng:-82.0990},
    198:{lat:27.1450,lng:-82.0975}, 199:{lat:27.1540,lng:-82.0960},
    200:{lat:27.1630,lng:-82.0942}, 201:{lat:27.1720,lng:-82.0922},
    202:{lat:27.1810,lng:-82.0900}, 203:{lat:27.1900,lng:-82.0878},
    204:{lat:27.1990,lng:-82.0856},
    // MM 205 = Exit 205 Clark Road / SR-72
    205:{lat:27.2080,lng:-82.0833},
    206:{lat:27.2170,lng:-82.0810}, 207:{lat:27.2260,lng:-82.0786},
    208:{lat:27.2350,lng:-82.0762}, 209:{lat:27.2440,lng:-82.0738},
    // MM 210 = Exit 210 Fruitville Road / SR-780
    210:{lat:27.2530,lng:-82.0713},
    211:{lat:27.2620,lng:-82.0688}, 212:{lat:27.2710,lng:-82.0663},
    // MM 213 = Exit 213 University Parkway — Sarasota/Manatee line
    213:{lat:27.2800,lng:-82.0638},
    214:{lat:27.2890,lng:-82.0613}, 215:{lat:27.2980,lng:-82.0588}
  };

  function checkI75MM(address) {
    var a = address.toUpperCase().trim();
    // Match: 183000 S I75, 210000 N I75, 195000 I-75, 200000 I75 etc.
    var m = a.match(/^(\d{3})000\s*[NS]?\s*I[-\s]?75\b/);
    if (m) {
      // Return the mile marker number so geocode() can use it
      return {mmOnly: true, mm: parseInt(m[1])};
    }
    return null;
  }

  // Query -> {lat,lng} | null. Successful lookups persist in this browser; misses only for this session.
  var GEO_STORE_KEY = "geocache_v1";
  var geocodeCache = {};
  var geoStored = {};
  try { geoStored = JSON.parse(prefGet(GEO_STORE_KEY, "{}")) || {}; } catch(e) { geoStored = {}; }
  Object.keys(geoStored).forEach(function(q) { geocodeCache[q] = geoStored[q]; });
  var geoInflight = {};
  var geoSaveTimer = null;
  var geoError = null;     // last geocoder failure (worker misconfigured, quota, network); null when healthy

  function rememberGeo(q, result) {
    geocodeCache[q] = result;
    if (!result) return;
    geoStored[q] = result;
    clearTimeout(geoSaveTimer);
    geoSaveTimer = setTimeout(function() {
      var keys = Object.keys(geoStored);
      // Keep the store bounded; drop the oldest insertions first
      if (keys.length > 1500) keys.slice(0, keys.length - 1500).forEach(function(k) { delete geoStored[k]; });
      prefSet(GEO_STORE_KEY, JSON.stringify(geoStored));
    }, 1000);
  }

  // Resolve one free-form query through the worker. Transient failures are not cached, so they retry next refresh.
  function geocodeQuery(q) {
    if (geocodeCache[q] !== undefined) return Promise.resolve(geocodeCache[q]);
    if (geoInflight[q]) return geoInflight[q];
    geoInflight[q] = fetch(WORKER_URL + "?geocode=" + encodeURIComponent(q))
      .then(function(r) {
        if (r.ok) return r.json();
        return r.json().catch(function() { return {}; }).then(function(d) {
          throw new Error((d.error || ("HTTP " + r.status)) + (d.detail ? ": " + d.detail : ""));
        });
      })
      .then(function(d) {
        geoError = null;
        var result = (d && typeof d.lat === "number" && inRegion(d.lat, d.lng)) ? {lat: d.lat, lng: d.lng} : null;
        rememberGeo(q, result);
        return result;
      })
      .catch(function(err) { geoError = err.message; return null; })
      .finally(function() { delete geoInflight[q]; });
    return geoInflight[q];
  }

  async function geocode(address, cityHint) {
    // I-75 mile markers: try the geocoder, fall back to the local table
    var mmCheck = checkI75MM(address);
    if (mmCheck && mmCheck.mmOnly) {
      var mmResult = await geocodeQuery("I-75 milepost " + mmCheck.mm + " Sarasota County FL");
      return mmResult || I75_MM[mmCheck.mm] || null;
    }
    var q = address.trim().replace(/\s*\/\s*/g, " & ") + ", " + (cityHint || "Sarasota") + ", FL";
    return geocodeQuery(q);
  }

  // ===== Map rendering =====
  function popupHtml(inc) {
    return "<div class=\"popup-type\">" + esc(inc.eventType) + "</div>" +
      "<div class=\"popup-addr\">" + esc(inc.location) + "</div>" +
      (inc.notes ? "<div class=\"popup-addr\">" + esc(inc.notes) + "</div>" : "") +
      "<div class=\"popup-time\">" + esc(inc.date) + " // " + esc(inc.time) + " // " + esc(inc.caseNum) + "</div>";
  }

  function selectCard(id, scroll) {
    selectedId = id;
    document.querySelectorAll(".inc-card.highlighted").forEach(function(c) { c.classList.remove("highlighted"); });
    var card = document.getElementById("card-" + id);
    if (card) {
      card.classList.add("highlighted");
      if (scroll) card.scrollIntoView({behavior:"smooth", block:"nearest"});
    }
  }

  // Add/update/remove markers to match `incidents` (only those with coordinates). Returns their bounds.
  function syncMarkers(incidents) {
    var keep = {};
    var bounds = [];
    incidents.forEach(function(inc) {
      if (inc._lat == null) return;
      keep[inc._id] = true;
      bounds.push([inc._lat, inc._lng]);

      var iconKey = (inc.source === "fhp" ? "fhp" : inc.cat) + (inc.isToday ? "_today" : "_older");
      var m = markersById[inc._id];
      if (!m) {
        m = L.marker([inc._lat, inc._lng], {icon: ICONS[iconKey] || ICONS.other_today, keyboard: false})
          .bindPopup(popupHtml(inc))
          .addTo(map);
        (function(id) { m.on("click", function() { selectCard(id, true); }); })(inc._id);
        markersById[inc._id] = m;
      } else {
        m.setLatLng([inc._lat, inc._lng]);
        if (m._iconKey !== iconKey) m.setIcon(ICONS[iconKey] || ICONS.other_today);
        m.setPopupContent(popupHtml(inc));
      }
      m._iconKey = iconKey;
    });
    Object.keys(markersById).forEach(function(id) {
      if (!keep[id]) { map.removeLayer(markersById[id]); delete markersById[id]; }
    });
    return bounds;
  }

  async function renderMap(incidents) {
    var seq = ++renderSeq;

    // Draw everything we already have coordinates for right away
    syncMarkers(incidents);

    // Then geocode the rest in parallel using zone as city hint for accuracy
    await Promise.all(incidents.map(async function(inc) {
      if (!inc.mappable) { inc._geo = "nomap"; return; }
      if (inc._lat != null) { inc._geo = "ok"; return; }
      var c = await geocode(inc.location, cityFromZone(inc.zone || "", inc.agencies || []));
      if (c) { inc._lat = c.lat; inc._lng = c.lng; inc._geo = "ok"; }
      else inc._geo = "none";
    }));

    // A newer render (filter change / refresh) started while we were waiting; let it win
    if (seq !== renderSeq) return;

    var bounds = syncMarkers(incidents);
    updateMapFlags(incidents);

    // Failed lookups aren't cached, so this clears by itself once the geocoder recovers
    if (geoError) {
      setStatus("Address lookup unavailable (" + geoError + ") -- county incidents can't be placed on the map", "warn");
    } else if (/^Address lookup unavailable/.test(document.getElementById("status-bar").textContent)) {
      setStatus("", "");
    }

    // Hold the fit until geocoding works, so a failed first load doesn't zoom onto the few markers it could place
    if (fitPending && bounds.length && !geoError) {
      fitPending = false;
      try { map.fitBounds(bounds, {padding:[28,28], maxZoom:14}); }
      catch(e) { map.setView([SC_LAT, SC_LNG], 10); }
    }
  }

  // ===== List rendering =====
  var MAP_FLAG = {
    ok:      {text: "",           title: ""},
    pending: {text: "Locating",   title: "Looking up this address"},
    nomap:   {text: "Not mapped", title: "No exact location in the feed (street name only or redacted)"},
    none:    {text: "Not mapped", title: "Address could not be located"}
  };

  function geoState(inc) {
    if (!inc.mappable) return "nomap";
    return inc._geo || (inc._lat != null ? "ok" : "pending");
  }

  function mapFlagHtml(inc) {
    var s = geoState(inc), f = MAP_FLAG[s];
    return "<span class=\"map-flag\" data-state=\"" + s + "\" title=\"" + esc(f.title) + "\">" + esc(f.text) + "</span>";
  }

  function updateMapFlags(incidents) {
    incidents.forEach(function(inc) {
      var card = document.getElementById("card-" + inc._id);
      var flag = card && card.querySelector(".map-flag");
      if (!flag) return;
      var s = geoState(inc), f = MAP_FLAG[s];
      if (flag.getAttribute("data-state") === s) return;
      flag.setAttribute("data-state", s);
      flag.title = f.title;
      flag.textContent = f.text;
    });
  }

  function isNew(inc) {
    var t = firstSeen[inc._id];
    return !!t && Date.now() - t < NEW_WINDOW_MS;
  }

  function cardHtml(inc) {
    var cat = inc.cat;
    var ag = inc.agency || "other";
    var addrHtml = inc.location
      ? "<div class=\"inc-addr\">&#x25B8; " + esc(inc.location) + "</div>"
      : "";
    var notesHtml = inc.notes
      ? "<div class=\"inc-notes\">" + esc(inc.notes) + "</div>"
      : "";

    // Build all agency tags
    var agencyTags = (inc.agencies || [ag]).map(function(a) {
      return "<span class=\"agency-tag " + a + "\">" + getAgencyLabel(a) + "</span>";
    }).join("");

    var fresh = isNew(inc);
    var cls = "inc-card " + (inc.isToday ? "is-today" : "is-older") + " agency-" + ag +
              (fresh ? " is-new" : "") + (inc._id === selectedId ? " highlighted" : "") +
              (renderedIds[inc._id] ? " settled" : "");
    var label = inc.eventType + ", " + (inc.location || "no address") + ", " + inc.date + " " + inc.time;

    return "<div class=\"" + cls + "\" id=\"card-" + inc._id + "\" data-id=\"" + inc._id + "\" role=\"button\" tabindex=\"0\" aria-label=\"" + esc(label) + "\">" +
      "<div class=\"inc-icon " + CAT_CLS[cat] + "\" aria-hidden=\"true\">" + (inc.source === "fhp" ? "🚓" : CAT_EMOJI[cat]) + "</div>" +
      "<div class=\"inc-body\">" +
        "<div class=\"inc-type\">" + esc(inc.eventType) + "</div>" +
        addrHtml +
        notesHtml +
        "<div class=\"inc-case\">" + agencyTags + mapFlagHtml(inc) + "</div>" +
      "</div>" +
      "<div class=\"inc-meta\">" +
        "<div class=\"inc-time\">" + esc(inc.time) + "</div>" +
        "<div class=\"inc-date\">" + esc(inc.date) + "</div>" +
        (fresh ? "<div class=\"status-badge badge-new\">NEW</div>" : "") +
        "<div class=\"status-badge " + (inc.isToday ? "badge-today" : "badge-older") + "\">" + (inc.isToday ? "TODAY" : "PRIOR") + "</div>" +
      "</div>" +
    "</div>";
  }

  // Ids on screen after the previous render; those cards skip the entrance animation so refreshes don't flicker
  var renderedIds = {};

  function renderList(incidents) {
    var el = document.getElementById("incident-list");
    if (!incidents.length) {
      var msg = currentAgency !== "all"
        ? "NO " + getAgencyLabel(currentAgency) + " INCIDENTS IN CURRENT FEED"
        : "NO INCIDENTS IN FEED";
      el.innerHTML = "<div class=\"state-screen\"><span style=\"font-size:28px\">&#x1F4E1;</span><span>" + msg + "</span></div>";
    } else {
      // Replacing innerHTML keeps the container's scroll position
      el.innerHTML = incidents.map(cardHtml).join("");
    }
    renderedIds = {};
    incidents.forEach(function(i) { renderedIds[i._id] = true; });
    renderMap(incidents);
  }

  function focusOnMap(id) {
    var inc = null;
    for (var i = 0; i < allIncidents.length; i++) {
      if (allIncidents[i]._id === id) { inc = allIncidents[i]; break; }
    }
    if (!inc) return;

    selectCard(id, false);

    function panTo() {
      map.setView([inc._lat, inc._lng], 15, {animate:true});
      if (markersById[id]) markersById[id].openPopup();
    }

    // In PulsePoint-only view there is no map to pan; switch to split so the map is visible
    if (currentView === "pp" && inc.mappable) setMapView("split");

    if (inc._lat != null) { panTo(); return; }

    // Coordinates not yet loaded — geocode on demand then pan
    if (inc.mappable) {
      var city = cityFromZone(inc.zone || "", inc.agencies || []);
      geocode(inc.location, city).then(function(c) {
        if (!c) return;
        inc._lat = c.lat; inc._lng = c.lng; inc._geo = "ok";
        syncMarkers(getFiltered());
        updateMapFlags([inc]);
        panTo();
      });
    }
  }

  // Card clicks + keyboard activation (Enter / Space) via delegation
  var listEl = document.getElementById("incident-list");
  listEl.addEventListener("click", function(e) {
    var card = e.target.closest(".inc-card");
    if (card) focusOnMap(card.getAttribute("data-id"));
  });
  listEl.addEventListener("keydown", function(e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".inc-card");
    if (!card) return;
    e.preventDefault();
    focusOnMap(card.getAttribute("data-id"));
  });

  // ===== Filters + stats =====
  function getAgencyFiltered() {
    if (currentAgency === "all") return allIncidents;
    if (currentAgency === "other") {
      return allIncidents.filter(function(i) {
        return i.agencies.some(function(a) { return a === "other" || a === "lbfd"; });
      });
    }
    return allIncidents.filter(function(i) { return i.agencies.indexOf(currentAgency) !== -1; });
  }

  function getFiltered() {
    var out = getAgencyFiltered();
    if (currentFilter === "today")   out = out.filter(function(i) { return i.isToday; });
    if (currentFilter === "fire")    out = out.filter(function(i) { return i.cat === "fire"; });
    if (currentFilter === "marine")  out = out.filter(function(i) { return i.cat === "marine"; });
    if (currentFilter === "traffic") out = out.filter(function(i) { return i.cat === "traffic"; });
    if (currentFilter === "alarm")   out = out.filter(function(i) { return i.cat === "alarm"; });
    return out;
  }

  // Stats follow the agency filter (not the type tabs, which would zero out the other counters)
  function updateStats() {
    var list = getAgencyFiltered();
    document.getElementById("s-today").textContent   = list.filter(function(i) { return i.isToday; }).length;
    document.getElementById("s-fire").textContent    = list.filter(function(i) { return i.cat === "fire"; }).length;
    document.getElementById("s-traffic").textContent = list.filter(function(i) { return i.cat === "traffic"; }).length;
    document.getElementById("s-total").textContent   = list.length;
  }

  function applyFilters() {
    updateStats();
    renderList(getFiltered());
  }

  function setAgency(a, btn) {
    currentAgency = a;
    document.querySelectorAll(".agency-btn").forEach(function(b) { b.classList.remove("active"); b.setAttribute("aria-pressed", "false"); });
    btn.classList.add("active"); btn.setAttribute("aria-pressed", "true");
    fitPending = true;
    applyFilters();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); t.setAttribute("aria-pressed", "false"); });
    btn.classList.add("active"); btn.setAttribute("aria-pressed", "true");
    fitPending = true;
    applyFilters();
  }

  document.querySelectorAll(".agency-btn, .tab").forEach(function(b) {
    b.setAttribute("aria-pressed", b.classList.contains("active") ? "true" : "false");
  });

  // ===== Map / PulsePoint view =====
  // PulsePoint's data API is protected by a bot challenge, so its own web app is embedded rather than scraped.
  var currentView = "map";
  var ppFrame   = document.getElementById("pp-frame");
  var ppPanel   = document.getElementById("pp-panel");
  var ppLoading = document.getElementById("pp-loading");
  var ppSlowTimer = null;
  document.getElementById("pp-open").href = PULSEPOINT_URL;

  function loadPulsePoint(force) {
    if (!force && ppFrame.getAttribute("src")) return;
    ppLoading.classList.remove("hidden");
    ppLoading.innerHTML = "<div class=\"spinner\"></div><span>CONNECTING TO PULSEPOINT...</span>";
    clearTimeout(ppSlowTimer);
    // Browsers that block third-party storage can stall PulsePoint's bot check inside a frame
    ppSlowTimer = setTimeout(function() {
      ppLoading.innerHTML = "<span>PULSEPOINT IS TAKING A WHILE</span>" +
        "<span>Your browser may be blocking it inside this page.</span>" +
        "<a href=\"" + PULSEPOINT_URL + "\" target=\"_blank\" rel=\"noopener\">OPEN PULSEPOINT IN A NEW TAB &#x2197;</a>";
    }, 20000);
    ppFrame.setAttribute("src", PULSEPOINT_URL + (force ? "&_=" + Date.now() : ""));
  }

  ppFrame.addEventListener("load", function() {
    if (!ppFrame.getAttribute("src")) return;
    clearTimeout(ppSlowTimer);
    // Give PulsePoint's app a moment to paint after its bot check before revealing it
    setTimeout(function() { ppLoading.classList.add("hidden"); }, 1200);
  });

  function setMapView(view) {
    currentView = view;
    prefSet("view", view);
    document.querySelectorAll(".map-tab").forEach(function(b) {
      var on = b.getAttribute("data-view") === view;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var section = document.getElementById("map-section");
    section.classList.toggle("view-pp", view === "pp");
    section.classList.toggle("view-split", view === "split");
    if (view !== "map") loadPulsePoint(false);
    if (view !== "pp") setTimeout(function() { map.invalidateSize(); }, 50);
  }

  document.querySelectorAll(".map-tab").forEach(function(b) {
    b.addEventListener("click", function() { setMapView(b.getAttribute("data-view")); });
  });
  document.getElementById("pp-reload").addEventListener("click", function() { loadPulsePoint(true); });

  var ppThemeBtn = document.getElementById("pp-theme");
  function setPpDark(on) {
    ppPanel.classList.toggle("pp-dark", on);
    ppThemeBtn.setAttribute("aria-pressed", on ? "true" : "false");
    ppThemeBtn.title = on ? "Dark rendering (click for PulsePoint's original colors)" : "Original colors (click for dark rendering)";
    prefSet("ppDark", on ? "1" : "0");
  }
  ppThemeBtn.addEventListener("click", function() { setPpDark(!ppPanel.classList.contains("pp-dark")); });
  setPpDark(prefGet("ppDark", "1") === "1");

  // ===== New-incident sound =====
  var soundOn = false;
  var audioCtx = null;
  var soundBtn = document.getElementById("sound-btn");

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
    soundBtn.innerHTML = on ? "&#x1F514;" : "&#x1F515;";
    prefSet("sound", on ? "1" : "0");
  }

  function chime() {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      [0, 0.22].forEach(function(offset) {
        var t = audioCtx.currentTime + offset;
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.2);
      });
    } catch(e) {}
  }

  // Browsers only allow audio after a user gesture, so the click that turns sound on also primes it
  soundBtn.addEventListener("click", function() { setSound(!soundOn); if (soundOn) chime(); });
  // A remembered "on" still needs one click anywhere on the page before the browser will play it
  setSound(prefGet("sound", "0") === "1");

  // ===== Feed loading =====
  var loadInFlight = false;

  async function fetchText(url) {
    var res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  }

  async function loadIncidents() {
    if (loadInFlight) return;
    loadInFlight = true;
    var btn = document.getElementById("refresh-btn");
    btn.classList.add("spinning");

    try {
      // Load both feeds in parallel; one failing shouldn't take down the other
      var results = await Promise.allSettled([
        fetchText(WORKER_URL).then(parseDispatchHTML),
        fetchText(WORKER_URL + "?src=fhp").then(parseFhpRss)
      ]);
      var cad = results[0], fhp = results[1];
      if (cad.status === "rejected" && fhp.status === "rejected") throw cad.reason;

      var incidents = [].concat(
        cad.status === "fulfilled" ? cad.value : [],
        fhp.status === "fulfilled" ? fhp.value : []
      );

      // Guarantee unique ids, carry coordinates over from the previous refresh, and spot new incidents
      var prev = {};
      allIncidents.forEach(function(i) { prev[i._id] = i; });
      var used = {};
      var now = Date.now();
      var newCount = 0;
      incidents.forEach(function(inc) {
        var base = inc._id, id = base, n = 1;
        while (used[id]) id = base + "-" + (++n);
        used[id] = true;
        inc._id = id;

        var old = prev[id];
        if (old && inc._lat == null && old._lat != null) {
          inc._lat = old._lat; inc._lng = old._lng; inc._geo = old._geo;
        }
        if (firstSeen[id] === undefined) {
          firstSeen[id] = initialLoadDone ? now : 0;
          if (initialLoadDone) newCount++;
        }
      });

      // Newest first across both sources
      incidents.sort(function(a, b) { return b._ts - a._ts; });

      allIncidents = incidents;
      applyFilters();

      lastSuccess = Date.now();
      lastAttemptFailed = false;

      if (cad.status === "rejected") {
        setStatus("County dispatch feed error: " + cad.reason.message + " -- showing FHP only", "warn");
      } else if (fhp.status === "rejected") {
        setStatus("FHP feed error: " + fhp.reason.message + " -- showing county dispatch only", "warn");
      } else if (!incidents.length) {
        setStatus("No incidents in current feed", "warn");
      } else if (newCount) {
        setStatus(newCount + " new incident" + (newCount === 1 ? "" : "s"), "good", 8000);
        chime();
      } else if (!initialLoadDone) {
        setStatus("Live -- Sarasota County 911 Dispatch + FHP (" + fhp.value.length + " traffic)", "good", 5000);
      } else if (document.getElementById("status-bar").className !== "good") {
        setStatus("", "");
      }
      initialLoadDone = true;

      document.getElementById("last-updated").textContent =
        "// LAST SYNC: " + new Date().toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false});

    } catch(err) {
      console.error(err);
      lastAttemptFailed = true;
      if (allIncidents.length) {
        // Keep showing the last good data rather than blanking the screen
        setStatus("Feed error: " + err.message + " -- showing data from " + fmtAge(Date.now() - lastSuccess), "error");
      } else {
        setStatus("Feed error: " + err.message, "error");
        document.getElementById("incident-list").innerHTML =
          "<div class=\"state-screen\"><span style=\"font-size:28px\">&#x26A0;</span><span>FEED OFFLINE -- TAP REFRESH</span></div>";
      }
    } finally {
      loadInFlight = false;
      btn.classList.remove("spinning");
      tick();
    }
  }

  // Refresh on an interval, but not while the tab is hidden; catch up immediately when it becomes visible
  setInterval(function() { if (!document.hidden) loadIncidents(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function() {
    if (!document.hidden && Date.now() - lastSuccess >= REFRESH_MS) loadIncidents();
  });

  var savedView = prefGet("view", "map");
  setMapView(["map", "split", "pp"].indexOf(savedView) !== -1 ? savedView : "map");
  loadIncidents();

  // Let the layout render then tell Leaflet to fill the column
  setTimeout(function() { map.invalidateSize(); }, 200);
</script>
</body>
</html>
